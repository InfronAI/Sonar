schema_version = "1.4"
artifacts = [{ source = "/app/calendar.db", destination = "calendar.db" }]
multi_step_reward_strategy = "mean"

[task]
name = "sonar-eval/reschedule-scanner"
authors = [{ name = "Sonar" }]

[agent]
timeout_sec = 240.0

[environment]
docker_image = "sonar-eval/workflows:1"
cpus = 1
memory_mb = 2048
storage_mb = 10240

[verifier]
timeout_sec = 30.0
environment_mode = "shared"

[[steps]]
name = "book"

[[steps]]
name = "reschedule"
